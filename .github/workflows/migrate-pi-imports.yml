name: Migrate remaining Pi imports

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[pi-imports-migrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          grep -rl "utils/piClient" src --include='*.ts' --include='*.tsx' | xargs -r sed -i 's#utils/piClient#utils/jcodeClient#g'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Migrate remaining Pi imports to JCode [pi-imports-migrated]" || exit 0
          git push origin HEAD:main
